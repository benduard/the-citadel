<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects</title>
<!--
  Vitality tile: projects
  store shape saved via Vitality.save/load: { projects: [ { id, title, done, createdAt, doneAt } ] }
  reports one stream: key "projects_done", kind "measure", value = count of done projects.
-->
<style>
  :root{
    --bg:#050505;
    --card:rgba(9,13,12,0.72);
    --border:rgba(148,163,158,0.16);
    --text:#E7ECEA;
    --muted:#94A39E;
    --faint:#5C6B66;
    --mint:#6EE7B7;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:transparent;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    overflow-x:hidden;
  }
  html[data-mode="page"] body{ background:var(--bg); }

  ::selection{ background:rgba(110,231,183,.28); }

  .eyebrow{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }
  .hero{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    line-height:1;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    border:1px solid rgba(110,231,183,.35);
    padding:4px 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--mint);
    white-space:nowrap;
  }

  .posterView{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
    height:100%;
    min-height:100vh;
    padding:20px;
    opacity:0;
    animation:rise .6s ease forwards;
  }
  .posterHero{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .posterHero .num{ font-size:44px; }
  .posterHero .unit{ font-size:13px; color:var(--muted); }

  .pageView{ display:none; }
  html[data-mode="page"] .pageView{
    display:block;
    min-height:100vh;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  html[data-mode="page"] .posterView{ display:none; }

  .pageHero{ display:flex; align-items:baseline; gap:12px; margin:10px 0 24px; flex-wrap:wrap; }
  .pageHero .num{ font-size:56px; }
  .pageHero .unit{ font-size:14px; color:var(--muted); }

  .addRow{ display:flex; gap:8px; margin-bottom:28px; }
  .addRow input{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    color:var(--text);
    font-size:14px;
    font-family:-apple-system,sans-serif;
    min-height:44px;
  }
  .addRow input::placeholder{ color:var(--faint); }
  .addBtn{
    background:var(--mint);
    color:#04120c;
    border:0;
    border-radius:999px;
    padding:0 22px;
    font-size:14px;
    font-weight:600;
    font-family:-apple-system,sans-serif;
    cursor:pointer;
    min-height:44px;
    transition:transform .15s ease;
  }
  .addBtn:active{ transform:scale(.97); }

  .section{ margin-bottom:28px; }
  .sectionTitle{ margin:0 0 12px; }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px 14px;
    opacity:0;
    animation:rise .5s ease forwards;
  }
  .check{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border-radius:999px;
    border:1px solid rgba(148,163,158,.35);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .check:active{ transform:scale(.9); }
  .item.done .check{ background:var(--mint); border-color:var(--mint); }
  .check svg{ width:16px; height:16px; opacity:0; transition:opacity .15s ease; }
  .item.done .check svg{ opacity:1; }

  .itemTitle{ flex:1; font-size:16px; font-weight:500; letter-spacing:-0.01em; }
  .item.done .itemTitle{ color:var(--muted); text-decoration:line-through; }

  .removeBtn{
    flex:0 0 auto;
    width:40px;
    height:40px;
    background:transparent;
    border:0;
    color:var(--faint);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .removeBtn svg{ width:14px; height:14px; }

  .empty{ color:var(--faint); font-size:13px; padding:8px 2px; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .posterView, .item{ animation:none; opacity:1; }
    .addBtn, .check{ transition:none; }
  }
</style>
</head>
<body>

  <div class="posterView" id="posterView">
    <p class="eyebrow">Projects</p>
    <div class="posterHero">
      <span class="num hero" id="posterNum">0</span>
      <span class="unit">active</span>
      <span class="pill" id="posterPill">0 done</span>
    </div>
  </div>

  <div class="pageView" id="pageView">
    <p class="eyebrow">Projects</p>
    <div class="pageHero">
      <span class="num hero" id="pageNum">0</span>
      <span class="unit">active</span>
      <span class="pill" id="pagePill">0 done</span>
    </div>

    <div class="addRow">
      <input id="newTitle" type="text" placeholder="New project" maxlength="80">
      <button class="addBtn" id="addBtn" type="button">Add</button>
    </div>

    <div class="section">
      <p class="eyebrow sectionTitle">To do</p>
      <div class="list" id="todoList"></div>
    </div>

    <div class="section">
      <p class="eyebrow sectionTitle">Done</p>
      <div class="list" id="doneList"></div>
    </div>
  </div>

<script>
// The Vitality bridge. postMessage only: a sealed tile has no storage of its
// own, so save/load/report all travel to the host and back.
(function(){
  'use strict';

  var seq = 0;
  var pending = {};

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== 'vitality-host') return;
    if (msg.type === 'load:result') {
      var resolve = pending[msg.id];
      if (resolve) { delete pending[msg.id]; resolve(msg.data); }
    }
  });

  function post(type, payload) {
    var msg = { source: 'vitality-tile', type: type };
    for (var k in payload) { if (Object.prototype.hasOwnProperty.call(payload, k)) msg[k] = payload[k]; }
    parent.postMessage(msg, '*');
    return msg;
  }

  window.Vitality = {
    save: function (data) { post('save', { data: data }); },
    load: function () {
      var id = 'l' + (++seq);
      return new Promise(function (resolve) {
        pending[id] = resolve;
        post('load', { id: id });
        // The host may not have registered this frame on the very first ask.
        setTimeout(function () { if (pending[id]) post('load', { id: id }); }, 300);
        setTimeout(function () { if (pending[id]) { delete pending[id]; resolve(null); } }, 3000);
      });
    },
    report: function (stream) { post('report', { stream: stream }); }
  };
})();
</script>

<script>
(function(){
  'use strict';

  var mode = location.hash === '#page' ? 'page' : 'grid';
  document.documentElement.setAttribute('data-mode', mode);

  var state = { projects: [] };

  function todayLocal(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1);
    if (m.length < 2) m = '0' + m;
    var day = String(d.getDate());
    if (day.length < 2) day = '0' + day;
    return y + '-' + m + '-' + day;
  }

  function uid(){
    return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function doneCount(){
    var n = 0;
    for (var i = 0; i < state.projects.length; i++) { if (state.projects[i].done) n++; }
    return n;
  }
  function activeCount(){
    return state.projects.length - doneCount();
  }

  function persist(){
    if (window.Vitality) Vitality.save(state);
  }

  function reportDone(){
    if (!window.Vitality) return;
    Vitality.report({
      key: 'projects_done',
      label: 'Projects Done',
      value: doneCount(),
      date: todayLocal(),
      kind: 'measure',
      goalDirection: 'up'
    });
  }

  function checkIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#04120c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>';
  }
  function removeIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>';
  }

  function renderPoster(){
    var num = document.getElementById('posterNum');
    var pill = document.getElementById('posterPill');
    if (num) num.textContent = String(activeCount());
    if (pill) pill.textContent = doneCount() + ' done';
  }

  function renderItem(p){
    var row = document.createElement('div');
    row.className = 'item' + (p.done ? ' done' : '');

    var check = document.createElement('button');
    check.className = 'check';
    check.type = 'button';
    check.setAttribute('aria-label', p.done ? 'Mark as not done' : 'Mark as done');
    check.innerHTML = checkIcon();
    check.addEventListener('click', function () { toggleDone(p.id); });

    var title = document.createElement('div');
    title.className = 'itemTitle';
    title.textContent = p.title;

    var remove = document.createElement('button');
    remove.className = 'removeBtn';
    remove.type = 'button';
    remove.setAttribute('aria-label', 'Remove project');
    remove.innerHTML = removeIcon();
    remove.addEventListener('click', function () { removeProject(p.id); });

    row.appendChild(check);
    row.appendChild(title);
    row.appendChild(remove);
    return row;
  }

  function renderPage(){
    var num = document.getElementById('pageNum');
    var pill = document.getElementById('pagePill');
    if (num) num.textContent = String(activeCount());
    if (pill) pill.textContent = doneCount() + ' done';

    var todoList = document.getElementById('todoList');
    var doneList = document.getElementById('doneList');
    if (!todoList || !doneList) return;

    todoList.innerHTML = '';
    doneList.innerHTML = '';

    var todos = state.projects.filter(function (p) { return !p.done; });
    var dones = state.projects.filter(function (p) { return p.done; });

    if (!todos.length) {
      var e1 = document.createElement('div');
      e1.className = 'empty';
      e1.textContent = 'no projects yet';
      todoList.appendChild(e1);
    } else {
      todos.forEach(function (p) { todoList.appendChild(renderItem(p)); });
    }

    if (!dones.length) {
      var e2 = document.createElement('div');
      e2.className = 'empty';
      e2.textContent = 'none finished yet';
      doneList.appendChild(e2);
    } else {
      dones.forEach(function (p) { doneList.appendChild(renderItem(p)); });
    }
  }

  function toggleDone(id){
    var p = null;
    for (var i = 0; i < state.projects.length; i++) { if (state.projects[i].id === id) { p = state.projects[i]; break; } }
    if (!p) return;
    p.done = !p.done;
    p.doneAt = p.done ? todayLocal() : null;
    persist();
    reportDone();
    renderAll();
  }

  function removeProject(id){
    state.projects = state.projects.filter(function (p) { return p.id !== id; });
    persist();
    reportDone();
    renderAll();
  }

  function addProject(){
    var input = document.getElementById('newTitle');
    if (!input) return;
    var v = input.value.trim();
    if (!v) return;
    state.projects.unshift({ id: uid(), title: v, done: false, createdAt: todayLocal(), doneAt: null });
    input.value = '';
    persist();
    renderAll();
    input.focus();
  }

  function renderAll(){
    renderPoster();
    renderPage();
  }

  function wire(){
    var addBtn = document.getElementById('addBtn');
    var input = document.getElementById('newTitle');
    if (addBtn) addBtn.addEventListener('click', addProject);
    if (input) input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addProject();
    });
  }

  function boot(){
    wire();
    if (window.Vitality) {
      Vitality.load().then(function (data) {
        if (data && Array.isArray(data.projects)) state.projects = data.projects;
        renderAll();
      });
    } else {
      renderAll();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
