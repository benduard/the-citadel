<title>Lists</title>
<!--
  Vitality tile: projects  (shown as "Lists")

  THE ID IS STILL 'projects' AND MUST STAY THAT WAY. The id is the vault
  storage key. Renaming it to 'lists' would point this tile at an empty slot,
  orphan every project already logged under 'projects', and break the
  projects_done history in the ledger along with the weight in weights.ts and
  the rank in lib/rank.js. The FILE and the display NAME changed on
  2026-07-31; the id did not, and there is no version of this worth undoing.

  store shape saved via Vitality.save/load:
    {
      v: 3,
      lists: {
        daily:    [ { id, title, done, repeat, createdAt, doneAt } ],
        weekly:   [ { id, title, done, repeat, createdAt, doneAt } ],
        grocery:  [ { id, title, done, createdAt, doneAt } ],
        projects: [ { id, title, done, createdAt, doneAt } ],
        someday:  [ { id, title, done, createdAt, doneAt } ]
      },
      archive: [ { title, list, doneAt } ],   // last 200 finished, newest first
      done: {                                 // THE CALENDAR'S RECORD, see below
        "YYYY-MM-DD": [ { id, title, list, repeat, createdAt } ]
      },
      logFrom: "YYYY-MM-DD",                  // first day the record was kept
      rolledOn: "YYYY-MM-DD",                 // day the daily list last rolled
      rolledWeek: "YYYY-MM-DD"                // Monday the weekly list last rolled
    }

  logFrom, and the difference between "no record" and "you failed". Before v3
  nothing tracked what was left undone on a given day, so a calendar that
  worked backwards from createdAt would paint every day since an item was made
  as a day of misses - including days before this tile recorded anything at
  all. That is inventing failures. logFrom is stamped once, on the first v3
  boot, and no day before it is ever scored: those days show whatever real
  crossed-off marks exist and nothing else.

  THE done LOG, and why it is not derived. The obvious move is to build the
  calendar out of what was already here - every item carries doneAt, and the
  archive keeps finished one-offs with their date. That would have been wrong,
  and quietly: roll() UNCHECKS a repeating item and sets its doneAt back to
  null, and a repeating item never enters the archive at all. So a daily habit
  ticked every day for a month - the exact thing a calendar is for - left no
  trace anywhere by the next morning. `done` records the day at the moment it
  is crossed, so that history survives the roll. Capped at DONE_DAYS_CAP days.

  What the calendar can and cannot know. Crossed-out is exact: it is what the
  log recorded. "Still open on that day" is DERIVED - an item counts if it
  existed by then (createdAt) and was not crossed until later - which is why
  createdAt is copied into the log entry as well as living on the item. Days
  before this version shipped hold only what doneAt and the archive had really
  recorded; a repeating item ticked back then is gone for good and is not
  guessed at.

  v1 was { projects: [ ... ] } with the same item shape. It migrates: those
  items become lists.projects untouched, so nothing logged before today moves
  or disappears. v2 migrates by backfilling `done` from the doneAt values and
  archive dates that were already recorded - real dates only, nothing invented.

  reports ONE stream, unchanged from v1 on purpose:
    key   "projects_done"
    kind  "measure"
    value count of DONE items in the projects list. Cumulative, exactly what it
          counted before, so the ledger's history keeps meaning the same thing.

  The daily and grocery lists deliberately do NOT report. A daily to do is not
  a project finished, and folding both into one key would make every row
  logged before today a lie about what it counted. If a daily-tasks number is
  wanted in the ledger it needs its own key, its own weight in weights.ts and
  its own entry in lib/rank.js - a decision, not a side effect of this file.

  ROLLING. On a new day the daily list rolls: repeating items uncheck, one-off
  items that were finished move to `archive`, and ANYTHING NOT FINISHED STAYS
  ON THE LIST - it follows you into the next day, and the next, until it is
  crossed off. That carry-forward is the whole point of a rolling list, so the
  item says how long it has been carrying rather than sitting there looking
  new. On a new week the weekly list does the same. Nothing is deleted - a
  finished item keeps its text and its date in the archive, because a list
  that quietly eats what you did is a list that cannot be trusted.
-->
<style>
  :root{

    --card:rgba(9,13,12,0.72);

    --border:rgba(148,163,158,0.16);
    --text:#E7ECEA;
    --muted:#94A39E;
    --faint:#5C6B66;
    --mint:#6EE7B7;
    --amber:#FCD34D;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:transparent;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
    -webkit-font-smoothing:antialiased;
    accent-color:var(--mint);
    padding-top:env(safe-area-inset-top);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    overflow-x:hidden;
  }
  html[data-mode="page"] body{ background:var(--bg); }
  ::selection{ background:rgba(110,231,183,.28); }

  .eyebrow{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin:0;
  }
  .hero{ font-family:Georgia,"Times New Roman",serif; font-weight:400; line-height:1; }
  .pill{
    display:inline-flex; align-items:center; border-radius:999px;
    border:1px solid rgba(110,231,183,.35); padding:4px 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px; letter-spacing:.08em; color:var(--mint); white-space:nowrap;
  }
  .pill.flat{ border-color:var(--border); color:var(--muted); }

  /* ---------- poster ---------- */
  .posterView{ height:100%; padding:16px; display:flex; flex-direction:column; gap:10px; }
  html[data-mode="page"] .posterView{ display:none; }
  .pTop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pMain{ display:flex; align-items:baseline; gap:8px; }
  .pNum{ font-size:clamp(30px,9vw,46px); color:var(--text); }
  .pOf{ font-size:13px; color:var(--muted); }
  .pBar{ height:5px; border-radius:3px; background:rgba(148,163,158,.14); overflow:hidden; }
  .pBar > i{ display:block; height:100%; border-radius:3px; background:var(--mint); }
  .pRows{ display:flex; flex-direction:column; gap:5px; margin-top:auto; }
  .pRow{

<script>
// ---- The Vitality bridge. Verbatim: this is the protocol, not this tile's
// own invention. A sealed frame has no localStorage of its own, so save/load/
// report all travel to the host and back.
(function(){
  'use strict';

  var seq = 0;
  var pending = {};
  var writeErrorHandlers = [];

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== 'vitality-host') return;
    if (msg.type === 'load:result') {
      var p = pending[msg.id];
      if (p) { delete pending[msg.id]; p.resolve({ ok: true, data: msg.data }); }
      return;
    }
    // The host says a write did not land. Never let the tile go on showing it
    // as saved: hand it to whoever is listening so it can say so.
    if (msg.type === 'save:error' || msg.type === 'report:error') {
      writeErrorHandlers.forEach(function (fn) { fn(msg.type, msg.reason); });
    }
  });

  function post(type, payload) {
    var msg = { source: 'vitality-tile', type: type };
    for (var k in payload) { if (Object.prototype.hasOwnProperty.call(payload, k)) msg[k] = payload[k]; }
    parent.postMessage(msg, '*');
    return msg;
  }

  window.Vitality = {
    save: function (data) { post('save', { data: data }); },

    /**
     * Resolves { ok, data }. ok:false means the host never answered - NOT that
     * the slot is empty. The difference is the whole ballgame: treating an
     * unanswered load as "you have nothing" lets the next save write that
     * emptiness over real data. A tile must refuse to save until it knows.
     */
    load: function () {
      var id = 'l' + (++seq);
      return new Promise(function (resolve) {
        pending[id] = { resolve: resolve };
        post('load', { id: id });
        // The host may not have registered this frame on the very first ask.
        // Keep asking: a slow vault (a cold remote read) is not an empty one.
        var tries = 0;
        var retry = setInterval(function () {
          if (!pending[id]) { clearInterval(retry); return; }
          if (++tries > 12) { // ~10s, then admit we do not know
            clearInterval(retry);
            delete pending[id];
            resolve({ ok: false, data: null });
            return;
          }
          post('load', { id: id });
        }, 800);
      });
    },

    report: function (stream) { post('report', { stream: stream }); },
    onWriteError: function (fn) { writeErrorHandlers.push(fn); }
  };
})();
</script>

<script>
(function(){
  'use strict';

  var mode = location.hash === '#page' ? 'page' : 'grid';
  document.documentElement.setAttribute('data-mode', mode);

  /**
   * THE LISTS. Ruben asked for daily, grocery and pending projects, and for a
   * recommendation on top. The two added ones are Weekly and Someday, and both
   * are here to protect the daily list rather than to pad the tile:
   *
   *   Weekly   is for things with a weekly rhythm rather than a daily one (the
   *            shop, meal prep, laundry, admin). They clog Daily and they are
   *            not projects, so they had nowhere honest to live.
   *   Someday  is the capture list. Anything that is not today's problem goes
   *            here instead of sitting in Daily looking like a failure. A
   *            daily list you scroll past is a daily list you stop reading.
   *
   * Delete either from this array if they are not earning their place.
   * `roll` decides behaviour, not decoration:
   *   'day'   unchecks repeats and archives finished one-offs each new day
   *   'week'  the same, each new Monday
   *   null    stays until you clear it yourself
   */
  var LISTS = [
    { id:'daily',    name:'Daily',    roll:'day',  repeatable:true,
      why:'Today only. Finished one-offs move to Recently finished overnight, and anything marked repeating just unchecks itself.' },
    { id:'weekly',   name:'Weekly',   roll:'week', repeatable:true,
      why:'The weekly rhythm: the shop, meal prep, laundry, admin. Rolls every Monday, same rules as Daily.' },
    { id:'grocery',  name:'Grocery',  roll:null,   repeatable:false,
      why:'Tick things off as you shop, then Clear finished when you are home. Nothing here rolls on its own.' },
    { id:'projects', name:'Projects', roll:null,   repeatable:false, counts:true,
      why:'The pending list. Finished projects stay ticked here, and this is the only list that reaches your ledger and counts toward your goals.' },
    { id:'someday',  name:'Someday',  roll:null,   repeatable:false,
      why:'Capture. Anything you do not want to forget but are not doing now. Send one to Daily when it becomes today’s problem.' }
  ];
  function listById(id){
    for (var i=0;i<LISTS.length;i++) if (LISTS[i].id === id) return LISTS[i];
    return LISTS[0];
  }

  var ARCHIVE_CAP = 200;
  // A bit over a year of crossed-out days, so a calendar can look back a full
  // year and still be reading real record rather than a trimmed stump.
  var DONE_DAYS_CAP = 400;

  var state = {
    v: 3,
    lists: { daily:[], weekly:[], grocery:[], projects:[], someday:[] },
    archive: [],
    done: {},
    logFrom: '',
    rolledOn: '',
    rolledWeek: ''
  };
  // Until the vault has actually answered, this tile does not know what it
  // holds, so it must not write. Saving an assumed-empty list would delete
  // whatever is really there.
  var loaded = false;
  var trouble = '';
  var rolledNote = '';
  var tab = 'daily';
  var view = 'lists';        // 'lists' | 'calendar'
  var calY = 0, calM = 0;    // month on screen, set from today at boot
  var calPick = '';          // the day whose detail is open

  /* ---------------- dates ---------------- */
  // ONE formatter. The roll, the done log and the calendar grid all key off
  // the same string, so there is no way for them to disagree about which day
  // a thing happened on. Local time on purpose: a day is the day you lived,
  // not a UTC boundary that turns over mid-evening.
  function dateKey(y, m, d){
    var mm = String(m + 1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d);     if (dd.length < 2) dd = '0' + dd;
    return y + '-' + mm + '-' + dd;
  }
  function todayLocal(){
    var d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // Monday of the current week, as a date key, so the weekly list rolls once a
  // week rather than once a day.
  function weekKey(){
    var d = new Date();
    var off = (d.getDay() + 6) % 7;         // 0 = Monday
    d.setDate(d.getDate() - off);
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // Whole days from a to b, both "YYYY-MM-DD". Built on Date.UTC so a clock
  // change or a DST hop cannot make a day count come out at 0 or 2.
  function daysBetween(a, b){
    if (!a || !b) return 0;
    var pa = a.split('-'), pb = b.split('-');
    return Math.round(
      (Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000
    );
  }
  function uid(){
    return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ---------------- counts ---------------- */
  function items(id){ return state.lists[id] || []; }
  function openOf(id){ return items(id).filter(function(x){ return !x.done; }); }
  function doneOf(id){ return items(id).filter(function(x){ return x.done; }); }
  // Unchanged from v1 and it must stay that way: this is what projects_done
  // has always counted, and the ledger's history depends on it.
  function doneCount(){ return doneOf('projects').length; }

  /* ---------------- the crossed-out log ---------------- */
  /**
   * Identity for a logged item. Prefer the item's own id; fall back to
   * list+title for entries backfilled out of the archive, which never carried
   * an id. Without this, unticking something would fail to find its own log
   * entry and the calendar would keep insisting you did it.
   */
  function doneKeyOf(x, listId){
    return x && x.id ? 'id:' + x.id : 'nm:' + listId + '|' + (x ? x.title : '');
  }
  function logDone(x, listId, date){
    if (!date || !x || !x.title) return;
    var day = state.done[date] || (state.done[date] = []);
    var k = doneKeyOf(x, listId);
    for (var i = 0; i < day.length; i++){
      if (doneKeyOf(day[i], day[i].list) === k) return;   // already recorded
    }
    day.push({
      id: x.id || '', title: x.title, list: listId,
      repeat: !!x.repeat, createdAt: x.createdAt || date
    });
  }
  // Unticking is not a correction to be argued with: if it is not crossed, it
  // was not done, and the calendar must stop saying it was.
  function unlogDone(x, listId, date){
    if (!date || !state.done[date]) return;
    var k = doneKeyOf(x, listId);
    state.done[date] = state.done[date].filter(function(e){
      return doneKeyOf(e, e.list) !== k;
    });
    if (!state.done[date].length) delete state.done[date];
  }
  function trimDoneLog(){
    var keys = Object.keys(state.done).sort();
    while (keys.length > DONE_DAYS_CAP) delete state.done[keys.shift()];
  }

  /**
   * Move what was ALREADY recorded into the log, on upgrade from v2. Every
   * date used here is one the tile really wrote down: a live item's doneAt, or
   * an archive entry's doneAt. Nothing is reconstructed, spread out or guessed
   * at to make the calendar look fuller than the record is.
   *
   * What this cannot recover, and does not pretend to: a repeating item ticked
   * before v3 had its doneAt set back to null by the next roll, and the item
   * never entered the archive. That day is simply not in the record, so the
   * calendar shows nothing there rather than inventing a tick.
   */
  function backfillDone(){
    LISTS.forEach(function(L){
      items(L.id).forEach(function(x){
        if (x.done && x.doneAt) logDone(x, L.id, x.doneAt);
      });
    });
    state.archive.forEach(function(a){
      if (a && a.doneAt && a.title){
        logDone({ title: a.title, createdAt: a.createdAt || a.doneAt }, a.list, a.doneAt);
      }
    });
    trimDoneLog();
  }

  /* ---------------- what a given day looked like ---------------- */
  // Crossed out on that day. Exact: this is the record, not a reconstruction.
  function crossedOn(date, listId){
    var day = state.done[date] || [];
    return listId ? day.filter(function(e){ return e.list === listId; }) : day.slice();
  }

  /**
   * Still open on that day, i.e. on the list and not crossed off, so it rolled
   * into the next day. Derived from two honest sources and nothing else:
   *   - a live item, if it existed by then and was not already finished by then
   *   - a since-crossed item, if it existed by then and was crossed LATER
   * An item created after that day was not on the list, which is the whole
   * reason createdAt rides along in the log entry.
   */
  function openOn(date, listId){
    var out = [], seen = {};
    // What was crossed that day is crossed, not carried.
    crossedOn(date, listId).forEach(function(e){ seen[doneKeyOf(e, listId)] = 1; });

    function take(e, born){
      if (!born || born > date) return;                 // not on the list yet
      var k = doneKeyOf(e, listId);
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ id: e.id || '', title: e.title, list: listId, repeat: !!e.repeat, createdAt: born });
    }

    items(listId).forEach(function(x){
      if (x.done && x.doneAt && x.doneAt <= date) return;   // already finished by then
      take(x, x.createdAt);
    });
    Object.keys(state.done).forEach(function(d){
      if (d <= date) return;                                // crossed later -> open then
      crossedOn(d, listId).forEach(function(e){ take(e, e.createdAt); });
    });
    return out;
  }

  // The rolling lists are the ones a calendar day can be "clear" of: they are
  // the lists that carry unfinished work forward. Grocery, Projects and
  // Someday have no notion of being owed on a given day.
  var ROLLING = ['daily', 'weekly'];

  // Was this tile keeping the record on that day? Before logFrom it was not,
  // and a day it never watched must never be scored as a day you missed.
  function hasRecord(date){
    return !!state.logFrom && date >= state.logFrom;
  }

  function dayStatus(date){
    var crossed = 0, missed = 0, carried = 0;
    ROLLING.forEach(function(id){
      crossed += crossedOn(date, id).length;
      if (hasRecord(date)){
        openOn(date, id).forEach(function(e){
          // A habit is missed that day. A one-off is owed, and follows you.
          if (e.repeat) missed++; else carried++;
        });
      }
    });
    var other = crossedOn(date).filter(function(e){
      return ROLLING.indexOf(e.list) === -1;
    }).length;
    var open = missed + carried;
    var total = crossed + open;
    return {
      crossed: crossed, missed: missed, carried: carried,
      open: open, other: other, total: total,
      noRecord: !hasRecord(date),
      // A day with nothing on the list is not a day you failed. It is only
      // "clear" if there was something to clear - and a day with no record
      // is never "clear", or one stray backfilled tick would decorate a day
      // nobody was watching as a perfect one.
      clear: hasRecord(date) && total > 0 && open === 0
    };
  }

  /**
   * The cells of a month, Monday first to match weekKey's week. Leading and
   * trailing blanks are nulls so the grid stays a true 7-wide calendar rather
   * than a reflowing list of days.
   */
  function monthCells(y, m){
    var lead = (new Date(y, m, 1).getDay() + 6) % 7;    // 0 = Monday
    var count = new Date(y, m + 1, 0).getDate();
    var cells = [], i;
    for (i = 0; i < lead; i++) cells.push(null);
    for (i = 1; i <= count; i++) cells.push(dateKey(y, m, i));
    while (cells.length % 7) cells.push(null);
    return cells;
  }

  function persist(){
    if (!loaded) return;
    if (window.Vitality) Vitality.save(state);
  }

  function reportDone(){
    if (!window.Vitality) return;
    Vitality.report({
      key: 'projects_done',
      label: 'Projects Done',
      value: doneCount(),
      date: todayLocal(),
      kind: 'measure',
      goalDirection: 'up'
    });
  }

  /**
   * Roll the day and the week.
   *
   * Nothing is deleted. A finished one-off leaves the live list but keeps its
   * text and the date it was done in `archive`, because a list that quietly
   * eats what you finished is a list you stop trusting. Repeating items simply
   * uncheck.
   *
   * Guarded on `loaded`: rolling before the vault answers would roll an empty
   * list and then save that emptiness over the real one. And a blank marker
   * rolls NOTHING - it only sets itself - or a first ever run would archive
   * work finished minutes ago.
   */
  function roll(){
    if (!loaded) return false;
    var changed = false;
    var moved = 0, reset = 0;
    var t = todayLocal(), wk = weekKey();

    LISTS.forEach(function(L){
      if (!L.roll) return;
      var due = L.roll === 'day'
        ? (state.rolledOn && state.rolledOn !== t)
        : (state.rolledWeek && state.rolledWeek !== wk);
      if (!due) return;
      var keep = [];
      items(L.id).forEach(function(x){
        if (x.done && x.repeat){ x.done = false; x.doneAt = null; reset++; keep.push(x); return; }
        if (x.done){
          state.archive.unshift({ title:x.title, list:L.id, doneAt:x.doneAt || t });
          moved++;
          return;                              // archived, never deleted
        }
        keep.push(x);                          // unfinished carries over
      });
      state.lists[L.id] = keep;
      changed = true;
    });

    if (state.rolledOn !== t){ state.rolledOn = t; changed = true; }
    if (state.rolledWeek !== wk){ state.rolledWeek = wk; changed = true; }

    if (state.archive.length > ARCHIVE_CAP) state.archive.length = ARCHIVE_CAP;

    if (moved || reset){
      var bits = [];
      if (moved) bits.push(moved + (moved === 1 ? ' finished item' : ' finished items') + ' moved to Recently finished');
      if (reset) bits.push(reset + ' repeating ' + (reset === 1 ? 'item' : 'items') + ' unchecked');
      rolledNote = 'New day: ' + bits.join(', ') + '.';
    }
    return changed;
  }

  /* ---------------- icons ---------------- */
  function checkIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#04120c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>';
  }
  function removeIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>';
  }
  function upIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>';
  }

  /* ---------------- poster ---------------- */
  function renderPoster(){
    var num = document.getElementById('posterNum');
    if (!num) return;
    var all = items('daily');
    var done = all.length - openOf('daily').length;
    var of = document.getElementById('posterOf');
    var bar = document.getElementById('posterBar');
    var pill = document.getElementById('posterPill');
    var rows = document.getElementById('posterRows');

    if (!all.length){
      num.textContent = '0';
      of.textContent = 'nothing on today';
      bar.style.width = '0%';
    } else {
      num.textContent = String(done);
      of.textContent = 'of ' + all.length + ' today';
      bar.style.width = Math.round(done / all.length * 100) + '%';
    }
    var clear = all.length > 0 && done === all.length;
    pill.textContent = clear ? 'day clear' : 'today';
    pill.className = 'pill' + (clear ? '' : ' flat');

    rows.innerHTML = '';
    ['weekly','grocery','projects'].forEach(function(id){
      var n = openOf(id).length;
      var d = document.createElement('div');
      d.className = 'pRow' + (n ? ' has' : '');
      d.innerHTML = '<span class="dot"></span>' + esc(listById(id).name) + '<b>' + n + '</b>';
      rows.appendChild(d);
    });
  }

  /* ---------------- rows and tabs ---------------- */
  function renderItem(x, L, archived){
    var row = document.createElement('div');
    row.className = 'item' + (x.done || archived ? ' done' : '');

    if (archived){
      var sp = document.createElement('span');
      sp.className = 'check';
      sp.style.opacity = '.5';
      sp.style.background = 'var(--mint)';
      sp.style.borderColor = 'var(--mint)';
      sp.innerHTML = checkIcon();
      sp.querySelector('svg').style.opacity = '1';
      row.appendChild(sp);
    } else {
      var check = document.createElement('button');
      check.className = 'check'; check.type = 'button';
      check.setAttribute('aria-label', (x.done ? 'Mark not done: ' : 'Mark done: ') + x.title);
      check.setAttribute('aria-pressed', x.done ? 'true' : 'false');
      check.innerHTML = checkIcon();
      check.addEventListener('click', function(){ toggle(L.id, x.id); });
      row.appendChild(check);
    }

    var txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = x.title;
    row.appendChild(txt);

    if (archived){
      var when = document.createElement('span');
      when.className = 'tag';
      when.textContent = x.doneAt || '';
      row.appendChild(when);
      return row;
    }

    if (x.repeat){
      var rp = document.createElement('span');
      rp.className = 'tag'; rp.textContent = L.roll === 'week' ? 'weekly' : 'daily';
      row.appendChild(rp);
    }

    /* How long this has been following you. Only on the lists that actually
       roll, and never on a repeating item - a daily habit is not "carried",
       it comes back by design. Faint for a day or two, amber once it has been
       sitting there three days, because that is the point where the list is
       telling you something. Never red: an old to do is not a failing. */
    if (!x.done && !x.repeat && L.roll && x.createdAt){
      var age = daysBetween(x.createdAt, todayLocal());
      if (age > 0){
        var ag = document.createElement('span');
        ag.className = age >= 3 ? 'carry' : 'tag';
        ag.textContent = age === 1 ? 'carried 1 day' : 'carried ' + age + ' days';
        row.appendChild(ag);
      }
    }

    // Someday is a holding pen, so its one useful action is getting out of it.
    if (L.id === 'someday' && !x.done){
      var up = document.createElement('button');
      up.className = 'iconBtn'; up.type = 'button';
      up.setAttribute('aria-label', 'Move to Daily: ' + x.title);
      up.title = 'Move to Daily';
      up.innerHTML = upIcon();
      up.addEventListener('click', function(){ promote(x.id); });
      row.appendChild(up);
    }

    var rm = document.createElement('button');
    rm.className = 'iconBtn'; rm.type = 'button';
    rm.setAttribute('aria-label', 'Remove: ' + x.title);
    rm.innerHTML = removeIcon();
    rm.addEventListener('click', function(){ remove(L.id, x.id); });
    row.appendChild(rm);

    return row;
  }

  function renderTabs(){
    var wrap = document.getElementById('tabs');
    wrap.innerHTML = '';
    LISTS.forEach(function(L){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (tab === L.id ? ' on' : '');
      b.setAttribute('aria-pressed', tab === L.id ? 'true' : 'false');
      var n = openOf(L.id).length;
      b.innerHTML = esc(L.name) + (n ? '<span class="c">' + n + '</span>' : '');
      b.disabled = !loaded;
      b.addEventListener('click', function(){ tab = L.id; renderPage(); });
      wrap.appendChild(b);
    });
  }

  /* ---------------- calendar ---------------- */
  var DOW = ['M','T','W','T','F','S','S'];
  var MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
  var DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function prettyDate(key){
    var p = key.split('-');
    return DAYNAMES[new Date(+p[0], +p[1]-1, +p[2]).getDay()] +
           ' ' + (+p[2]) + ' ' + MONTHS[+p[1]-1];
  }

  function daySentence(st, isToday){
    var bits = [];
    if (st.crossed) bits.push(st.crossed + ' crossed off');
    if (st.other) bits.push(st.other + ' finished on other lists');

    if (st.noRecord){
      // Say plainly that nothing was being watched, rather than showing a
      // clean day that reads like a day with nothing to do.
      return bits.length
        ? bits.join(', ') + '. What was left undone was not being recorded yet.'
        : 'No record kept for this day.';
    }
    if (!st.total && !st.other) return 'Nothing was on the list.';
    if (st.clear && !st.other) return 'Day clear. All ' + st.crossed + ' crossed off.';
    if (st.missed) bits.push(st.missed + (st.missed === 1 ? ' habit missed' : ' habits missed'));
    if (st.carried) bits.push(st.carried + (isToday ? ' still open' : ' carried into the next day'));
    return bits.join(', ') + '.';
  }

  function calLabel(key, st){
    if (st.noRecord) return key + (st.crossed || st.other ? ', ' + (st.crossed + st.other) + ' crossed off' : ', no record kept');
    if (!st.total && !st.other) return key + ', nothing on the list';
    var bits = [];
    if (st.crossed) bits.push(st.crossed + ' crossed off');
    if (st.missed) bits.push(st.missed + ' habits missed');
    if (st.carried) bits.push(st.carried + ' left');
    if (st.other) bits.push(st.other + ' on other lists');
    return key + ', ' + bits.join(', ');
  }

  function secLabelEl(text){
    var d = document.createElement('div');
    d.className = 'secLabel';
    var s = document.createElement('span');
    s.textContent = text;
    d.appendChild(s);
    return d;
  }

  function calRow(e, crossed, age){
    var row = document.createElement('div');
    row.className = 'item' + (crossed ? ' done' : '');

    var sp = document.createElement('span');
    sp.className = 'check';
    if (crossed){
      sp.style.background = 'var(--mint)';
      sp.style.borderColor = 'var(--mint)';
      sp.innerHTML = checkIcon();
      sp.querySelector('svg').style.opacity = '1';
    }
    row.appendChild(sp);

    var txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = e.title;
    row.appendChild(txt);

    var lt = document.createElement('span');
    lt.className = 'tag';
    lt.textContent = listById(e.list).name;
    row.appendChild(lt);

    // Age is only meaningful for a one-off that is genuinely owed. A repeating
    // item is not "27 days old", it is due again - saying otherwise turns a
    // habit into a debt.
    if (!crossed && !e.repeat && age > 0){
      var ag = document.createElement('span');
      ag.className = age >= 3 ? 'carry' : 'tag';
      ag.textContent = age === 1 ? '1 day old' : age + ' days old';
      row.appendChild(ag);
    }
    return row;
  }

  // The head, in calendar view, answers "how did this month go" rather than
  // "how many are open in Daily".
  function renderCalHead(){
    var cells = monthCells(calY, calM), crossed = 0, clear = 0, t = todayLocal();
    cells.forEach(function(k){
      if (!k || k > t) return;
      var st = dayStatus(k);
      crossed += st.crossed + st.other;
      if (st.clear) clear++;
    });
    document.getElementById('pageNum').textContent = String(crossed);
    document.getElementById('pageOf').textContent = 'crossed off in ' + MONTHS[calM];
    document.getElementById('pagePill').textContent =
      clear + (clear === 1 ? ' day clear' : ' days clear');
  }

  function renderCalendar(){
    var t = todayLocal();
    var now = new Date(), thisY = now.getFullYear(), thisM = now.getMonth();

    document.getElementById('calMonth').textContent = MONTHS[calM] + ' ' + calY;
    // There is nothing recorded in the future, so there is nowhere forward to go.
    document.getElementById('calNext').disabled =
      calY > thisY || (calY === thisY && calM >= thisM);

    var dow = document.getElementById('calDow');
    dow.innerHTML = '';
    DOW.forEach(function(d){
      var s = document.createElement('span');
      s.textContent = d;
      dow.appendChild(s);
    });

    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    monthCells(calY, calM).forEach(function(key){
      var c = document.createElement('button');
      c.type = 'button';
      if (!key){
        c.className = 'cell blank';
        c.disabled = true;
        grid.appendChild(c);
        return;
      }

      var st = dayStatus(key);
      var future = key > t;
      c.className = 'cell' + (future ? ' future' : '') + (key === t ? ' today' : '') +
                    (key === calPick ? ' on' : '') + (st.clear ? ' clear' : '') +
                    (st.noRecord ? ' norec' : '');
      c.disabled = future;

      var n = document.createElement('span');
      n.textContent = String(parseInt(key.slice(8), 10));
      c.appendChild(n);

      // A progress bar on a day nothing was being recorded would be a made-up
      // score, so those days get at most a dot saying "something happened".
      if (st.noRecord){
        if (st.crossed || st.other){
          var nd = document.createElement('span');
          nd.className = 'odot';
          c.appendChild(nd);
        } else {
          var ng = document.createElement('span');
          ng.className = 'gap';
          c.appendChild(ng);
        }
      } else if (st.total){
        var bar = document.createElement('span');
        bar.className = 'bar';
        var fill = document.createElement('i');
        fill.style.width = Math.round(st.crossed / st.total * 100) + '%';
        bar.appendChild(fill);
        c.appendChild(bar);
      } else if (st.other){
        var od = document.createElement('span');
        od.className = 'odot';
        c.appendChild(od);
      } else {
        // A spacer, so a day with nothing on it does not sit taller than its
        // neighbours and read as different.
        var g = document.createElement('span');
        g.className = 'gap';
        c.appendChild(g);
      }

      c.setAttribute('aria-label', calLabel(key, st));
      if (!future) c.addEventListener('click', function(){ calPick = key; renderPage(); });
      grid.appendChild(c);
    });

    var keys = Object.keys(state.done).sort();
    document.getElementById('calNote').textContent = keys.length
      ? 'Everything you cross off is recorded on the day you did it. This record starts ' + keys[0] + '.'
      : 'Nothing crossed off yet. Tick something on a list and it lands here, on the day you did it.';

    renderCalDay();
  }

  function renderCalDay(){
    var wrap = document.getElementById('calDay');
    wrap.innerHTML = '';
    if (!calPick) return;

    var isToday = calPick === todayLocal();
    var st = dayStatus(calPick);

    var h = document.createElement('p');
    h.className = 'calDate';
    h.textContent = prettyDate(calPick) + (isToday ? ' · today' : '');
    wrap.appendChild(h);

    var sum = document.createElement('p');
    sum.className = 'calSum';
    sum.textContent = daySentence(st, isToday);
    wrap.appendChild(sum);

    var crossed = crossedOn(calPick);
    if (crossed.length){
      wrap.appendChild(secLabelEl('Crossed off'));
      var cl = document.createElement('div');
      cl.className = 'list';
      crossed.forEach(function(e){ cl.appendChild(calRow(e, true, 0)); });
      wrap.appendChild(cl);
    }

    // Before the record began there is nothing honest to say about what was
    // left undone, so nothing is said.
    var open = [];
    if (!st.noRecord){
      ROLLING.forEach(function(id){ open = open.concat(openOn(calPick, id)); });
    }
    var missed = open.filter(function(e){ return e.repeat; });
    var carried = open.filter(function(e){ return !e.repeat; });

    function section(label, rows){
      if (!rows.length) return;
      wrap.appendChild(secLabelEl(label));
      var el = document.createElement('div');
      el.className = 'list';
      rows.forEach(function(e){
        el.appendChild(calRow(e, false, daysBetween(e.createdAt, calPick)));
      });
      wrap.appendChild(el);
    }
    section(isToday ? 'Not done yet' : 'Not done that day', missed);
    section(isToday ? 'Still open today' : 'Not crossed, moved to the next day', carried);

    if (!crossed.length && !open.length && !st.noRecord){
      var e2 = document.createElement('div');
      e2.className = 'empty';
      e2.textContent = 'Nothing on the list that day.';
      wrap.appendChild(e2);
    }
  }

  /* ---------------- page ---------------- */
  function renderPage(){
    if (mode !== 'page') return;

    var tEl = document.getElementById('trouble');
    tEl.hidden = !trouble; tEl.textContent = trouble;
    var rEl = document.getElementById('rolled');
    rEl.hidden = !rolledNote; rEl.textContent = rolledNote;

    var vl = document.getElementById('viewLists'), vc = document.getElementById('viewCal');
    vl.className = 'vBtn' + (view === 'lists' ? ' on' : '');
    vc.className = 'vBtn' + (view === 'calendar' ? ' on' : '');
    vl.setAttribute('aria-pressed', view === 'lists' ? 'true' : 'false');
    vc.setAttribute('aria-pressed', view === 'calendar' ? 'true' : 'false');
    document.getElementById('listsWrap').hidden = view !== 'lists';
    document.getElementById('calWrap').hidden = view !== 'calendar';

    if (view === 'calendar'){
      renderCalHead();
      renderCalendar();
      return;
    }

    var L = listById(tab);
    var open = openOf(tab), done = doneOf(tab);
    document.getElementById('pageNum').textContent = String(open.length);
    document.getElementById('pageOf').textContent = 'open in ' + L.name;
    document.getElementById('pagePill').textContent = done.length + ' done';

    renderTabs();
    document.getElementById('why').textContent = L.why;
    document.getElementById('newTitle').placeholder = 'Add to ' + L.name;

    var repWrap = document.getElementById('repWrap');
    repWrap.hidden = !L.repeatable;
    if (!L.repeatable) document.getElementById('repeats').checked = false;

    var openEl = document.getElementById('openList');
    openEl.innerHTML = '';
    if (!open.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = done.length
        ? (L.roll ? 'Nothing open. What is finished clears on its own.' : 'Nothing open. Clear the finished ones when you are ready.')
        : 'Nothing here yet. Add the first one above.';
      openEl.appendChild(e);
    } else {
      open.forEach(function(x){ openEl.appendChild(renderItem(x, L, false)); });
    }

    var dw = document.getElementById('doneWrap');
    dw.hidden = !done.length;
    if (done.length){
      var dl = document.getElementById('doneList');
      dl.innerHTML = '';
      done.forEach(function(x){ dl.appendChild(renderItem(x, L, false)); });
      // Projects is the counted list: clearing a finished project would walk
      // projects_done backwards, so that button is not offered there.
      document.getElementById('clearDone').hidden = !!L.counts;
    }

    var arch = state.archive.filter(function(a){ return a.list === tab; });
    var aw = document.getElementById('archWrap');
    aw.hidden = !arch.length;
    if (arch.length){
      document.getElementById('archCount').textContent = arch.length;
      var al = document.getElementById('archList');
      al.innerHTML = '';
      arch.slice(0, 30).forEach(function(a){ al.appendChild(renderItem(a, L, true)); });
    }
  }

  function renderAll(){ renderPoster(); renderPage(); }

  /* ---------------- actions ---------------- */
  function toggle(listId, id){
    var arr = items(listId);
    for (var i=0;i<arr.length;i++){
      if (arr[i].id === id){
        var was = arr[i].doneAt;
        arr[i].done = !arr[i].done;
        arr[i].doneAt = arr[i].done ? todayLocal() : null;
        // The calendar's record is written HERE, at the moment it is crossed,
        // and not derived later from doneAt - roll() wipes doneAt on repeating
        // items, so deriving it would lose every habit the next morning.
        if (arr[i].done) logDone(arr[i], listId, arr[i].doneAt);
        else unlogDone(arr[i], listId, was || todayLocal());
        trimDoneLog();
        break;
      }
    }
    persist();
    if (listId === 'projects') reportDone();
    renderAll();
  }

  function remove(listId, id){
    state.lists[listId] = items(listId).filter(function(x){ return x.id !== id; });
    persist();
    if (listId === 'projects') reportDone();
    renderAll();
  }

  function promote(id){
    var found = null;
    state.lists.someday = items('someday').filter(function(x){
      if (x.id === id){ found = x; return false; }
      return true;
    });
    if (found){
      found.done = false; found.doneAt = null;
      state.lists.daily.push(found);
      tab = 'daily';
    }
    persist();
    renderAll();
  }

  function add(){
    var input = document.getElementById('newTitle');
    var title = (input.value || '').trim();
    if (!title) return;
    var L = listById(tab);
    var rep = L.repeatable && document.getElementById('repeats').checked;
    items(tab).push({
      id: uid(), title: title, done: false, repeat: !!rep,
      createdAt: todayLocal(), doneAt: null
    });
    input.value = '';
    input.focus();
    persist();
    renderAll();
  }

  function clearDone(){
    var L = listById(tab);
    if (L.counts) return;              // never walk projects_done backwards
    doneOf(tab).forEach(function(x){
      state.archive.unshift({ title:x.title, list:tab, doneAt:x.doneAt || todayLocal() });
    });
    if (state.archive.length > ARCHIVE_CAP) state.archive.length = ARCHIVE_CAP;
    state.lists[tab] = openOf(tab);
    persist();
    renderAll();
  }

  /* ---------------- boot ---------------- */
  function enable(on){
    ['newTitle','addBtn','repeats'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.disabled = !on;
    });
  }

  function wire(){
    var btn = document.getElementById('addBtn');
    var input = document.getElementById('newTitle');
    if (btn) btn.addEventListener('click', add);
    if (input) input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') add();
    });
    var cd = document.getElementById('clearDone');
    if (cd) cd.addEventListener('click', clearDone);

    document.getElementById('viewLists').addEventListener('click', function(){
      view = 'lists'; renderPage();
    });
    document.getElementById('viewCal').addEventListener('click', function(){
      view = 'calendar';
      if (!calPick) calPick = todayLocal();
      renderPage();
    });
    document.getElementById('calPrev').addEventListener('click', function(){
      calM--; if (calM < 0){ calM = 11; calY--; }
      renderPage();
    });
    document.getElementById('calNext').addEventListener('click', function(){
      calM++; if (calM > 11){ calM = 0; calY++; }
      renderPage();
    });
  }

  var bootNow = new Date();
  calY = bootNow.getFullYear();
  calM = bootNow.getMonth();
  calPick = todayLocal();

  wire();
  enable(false);
  renderAll();

  Vitality.onWriteError(function(){
    trouble = 'That did not save. Your lists are still on screen, but the vault refused the write.';
    renderPage();
  });

  Vitality.load().then(function(res){
    if (!res.ok){
      trouble = 'Could not reach your vault. Nothing is saving until it answers, so nothing gets written over.';
      renderPage();
      return;
    }
    var d = res.data;
    if (d && typeof d === 'object'){
      if (d.v === 2 || d.v === 3){
        LISTS.forEach(function(L){
          state.lists[L.id] = (d.lists && Array.isArray(d.lists[L.id])) ? d.lists[L.id] : [];
        });
        state.archive = Array.isArray(d.archive) ? d.archive : [];
        state.rolledOn = d.rolledOn || '';
        state.rolledWeek = d.rolledWeek || '';
        // v3 carries its own log. v2 never had one, so it is built from the
        // dates v2 did record - and only from those.
        var hasLog = d.done && typeof d.done === 'object' && !Array.isArray(d.done);
        state.done = hasLog ? d.done : {};
        state.logFrom = d.logFrom || '';
        if (!hasLog) backfillDone();
      } else if (Array.isArray(d.projects)){
        // v1. Its items ARE the projects list, carried across untouched so
        // nothing logged before today moves or disappears.
        state.lists.projects = d.projects;
        backfillDone();
      }
    }
    loaded = true;
    enable(true);
    var changed = roll();
    // Stamped once, the first time this version ever runs. Everything before
    // this day is shown as unrecorded rather than scored, because it was.
    if (!state.logFrom){ state.logFrom = todayLocal(); changed = true; }
    if (changed) persist();
    renderAll();
    reportDone();
  });
})();
</script>
</body>
</html>
